<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonathan Pierrot — Monteur Vidéo</title>
<style>
:root{--bg:#070708;--card:#111113;--border:#232326;--muted:#9aa0a6;--text:#f6f6f7;--accent:#ff5a1f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;background:rgba(7,7,8,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:24px 0 80px}
.card{grid-column:span 6;background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card.wide{grid-column:span 12;display:grid;grid-template-columns:1.2fr.8fr}
@media(max-width:860px){.card,.card.wide{grid-column:span 12;grid-template-columns:1fr}}
.thumb{position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:300px;aspect-ratio:9/16}
.thumb.is-16-9{aspect-ratio:16/9}
.thumb video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#000;display:block}
/* FIX FINAL SANS CROP : on fixe la hauteur à 100%, pas la largeur */
.thumb video.fix-916{height:100%;width:auto;max-width:none;transform:scaleX(0.31640625);transform-origin:center}
.ov{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 60%);display:flex;align-items:flex-end;padding:10px}
.play{width:36px;height:36px;border-radius:999px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900}
.info{padding:12px 14px;border-top:1px solid var(--border)}
.pill{font-size:10px;padding:4px 8px;border-radius:999px;background:var(--accent);color:#fff}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;place-items:center;padding:12px}
.lightbox.open{display:grid}
.box{width:min(96vw,900px);background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}
.box.vid{background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:1;min-height:400px;padding:10px;aspect-ratio:9/16}
.box.vid.is-16-9{aspect-ratio:16/9}
.box.vid video{height:100%;width:auto;max-width:none;object-fit:contain}
.box.vid video.fix-916{height:100%;width:auto;transform:scaleX(0.31640625);transform-origin:center}
</style>
</head>
<body>
<header><div class="container hdr"><div style="font-weight:900">JONATHAN PIERROT <span style="color:#ff5a1f">— Monteur Vidéo</span></div><div style="font-size:11px;color:#9aa0a6">Fix sans crop • height:100% + scaleX</div></div></header>

<div class="container grid">
<div class="card wide" onclick="openVideo('pubj4')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/Pubj4_web.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Maison Tahri — 30 ans (25s)</h4><p style="font-size:12px;color:#9aa0a6">9:16 plein écran sans crop — texte plus coupé</p></div></div>

<div class="card" onclick="openVideo('concentre')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/Concentré_Samir_web.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Concentré Samir (13s)</h4></div></div>

<div class="card" onclick="openVideo('pubmaster')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/Pubmaster1_web.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Diagnostic Toiture (29s)</h4></div></div>

<div class="card" onclick="openVideo('takemoon')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/takemetothemoon.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Take Me To The Moon</h4></div></div>
<div class="card" onclick="openVideo('daidai')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/daidai.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Daidai</h4></div></div>
<div class="card" onclick="openVideo('bumpit')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/bumpit.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Bumpit</h4></div></div>
<div class="card" onclick="openVideo('cheche')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/cheche.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>Cheche</h4></div></div>
<div class="card" onclick="openVideo('nextdate')"><div class="thumb is-16-9"><video muted loop playsinline><source src="videos/nextdate.mp4"></video><div class="ov"><div class="play">▶</div></div></div><div class="info"><h4>NextDate</h4></div></div>
</div>

<div id="lightbox" class="lightbox" onclick="if(event.target===this)closeVideo()"><div class="box"><div class="vid" id="lb-wrap"><video id="lb-video" controls playsinline></video></div><div style="padding:12px;display:flex;justify-content:space-between"><h4 id="lb-title"></h4><button onclick="closeVideo()" style="width:30px;height:30px;border-radius:999px;border:1px solid #222;background:#111;color:#fff">✕</button></div></div></div>

<script>
const videos={
concentre:{src:"videos/Concentré_Samir_web.mp4",title:"Concentré Samir",fix:false,isVert:false},
pubmaster:{src:"videos/Pubmaster1_web.mp4",title:"Diagnostic Toiture",fix:false,isVert:false},
pubj4:{src:"videos/Pubj4_web.mp4",title:"Savoir-faire +30 ans",fix:false,isVert:false},
takemoon:{src:"videos/takemetothemoon.mp4",title:"Take Me To The Moon",fix:false,isVert:false},
daidai:{src:"videos/daidai.mp4",title:"Daidai",fix:false,isVert:false},
bumpit:{src:"videos/bumpit.mp4",title:"Bumpit",fix:false,isVert:false},
cheche:{src:"videos/cheche.mp4",title:"Cheche",fix:false,isVert:false},
nextdate:{src:"videos/nextdate.mp4",title:"NextDate",fix:false,isVert:false}
};
function openVideo(id){
  const v=videos[id]; if(!v) return;
  const wrap=document.getElementById('lb-wrap');
  const video=document.getElementById('lb-video');
  wrap.className = 'vid ' + (v.isVert? '' : 'is-16-9');
  video.className = v.fix? 'fix-916' : '';
  video.innerHTML=`<source src="${v.src}" type="video/mp4">`;
  document.getElementById('lb-title').textContent=v.title;
  document.getElementById('lightbox').classList.add('open');
  video.load(); video.play().catch(()=>{});
}
function closeVideo(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lb-video').pause();}
</script>
</body>
</html>
